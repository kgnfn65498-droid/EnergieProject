name: validate-32530-development
on:
  push:
    branches:
      - work/32.5.30-root-clearup
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile changed 32.5.30 modules
        run: |
          python -m py_compile             tools/atomic_app_swap.py             tools/minimal_release_preflight.py             tools/ha_delivery_adapter.py             tools/project_clearup_move_executor.py             tools/root_cleanup_executor_32530.py             slimmemeterportal_import/rootfs/app/project_clearup.py             slimmemeterportal_import/rootfs/app/project_clearup_auto.py             slimmemeterportal_import/rootfs/app/project_hygiene.py             slimmemeterportal_import/rootfs/app/root_structure_policy.py             slimmemeterportal_import/rootfs/app/projectmanager_v2/runtime_sources.py             slimmemeterportal_import/rootfs/app/projectmanager_v2/root_cleanup_32530.py             slimmemeterportal_import/rootfs/app/projectmanager_v2/command_processor.py
      - name: ROOT cleanup targeted regression
        run: python -m pytest -q tests/test_v32530_root_cleanup.py
