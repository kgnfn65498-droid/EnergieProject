name: v32.3.14 review verification
# temporary review gate; removed before merge

on:
  push:
    branches:
      - feature/v32.3.14-release-validation-hold

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest openpyxl xlsxwriter pypdf reportlab
      - name: Run full regression suite
        run: pytest -q
