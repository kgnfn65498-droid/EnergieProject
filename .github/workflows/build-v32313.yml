name: build v32.3.13 installer

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer-compatible ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSIE.txt)"
          test "$VERSION" = "32.3.13"
          STAGE="$RUNNER_TEMP/release-stage"
          ZIP="$RUNNER_TEMP/EnergieProject_v32.3.13.zip"
          rm -rf "$STAGE" "$ZIP"
          mkdir -p "$STAGE"
          git ls-files -z | while IFS= read -r -d '' path; do
            case "$path" in
              .github/*|MANIFEST.sha256|SHA256SUMS.json) continue ;;
            esac
            mkdir -p "$STAGE/$(dirname "$path")"
            cp -p "$path" "$STAGE/$path"
          done
          python - "$STAGE" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          stage = Path(sys.argv[1])
          files = sorted(p for p in stage.rglob('*') if p.is_file())
          rows=[]
          manifest=[]
          for p in files:
              rel=p.relative_to(stage).as_posix()
              data=p.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              manifest.append(f"{sha}  {rel}\n")
              rows.append({'path':rel,'sha256':sha,'size':len(data)})
          (stage/'MANIFEST.sha256').write_text(''.join(manifest), encoding='utf-8')
          (stage/'SHA256SUMS.json').write_text(json.dumps({'version':'32.3.13','files':rows}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          REQUIRED="README.md INSTALL.md CHANGELOG.md MANIFEST.sha256 SHA256SUMS.json repository.yaml VERSIE.txt"
          for f in $REQUIRED; do test -f "$STAGE/$f"; done
          (cd "$STAGE" && sha256sum -c MANIFEST.sha256 >/dev/null)
          test "$(tr -d '\r\n ' < "$STAGE/VERSIE.txt")" = "32.3.13"
          grep -q 'version: "32.3.13"' "$STAGE/slimmemeterportal_import/config.yaml"
          grep -q 'APP_VERSION = "32.3.13"' "$STAGE/slimmemeterportal_import/rootfs/app/main.py"
          grep -q 'TARGET_RELEASE_VERSION = "32.3.13"' "$STAGE/slimmemeterportal_import/rootfs/app/mode_entrypoint.py"
          (cd "$STAGE" && zip -qr "$ZIP" .)
          unzip -t "$ZIP" >/dev/null
          python - "$ZIP" <<'PY'
          import zipfile, sys
          z=zipfile.ZipFile(sys.argv[1])
          names=set(z.namelist())
          required={'README.md','INSTALL.md','CHANGELOG.md','MANIFEST.sha256','SHA256SUMS.json','repository.yaml','VERSIE.txt'}
          missing=required-names
          if missing: raise SystemExit(f'missing root files: {sorted(missing)}')
          if any(n.startswith('EnergieProject/') for n in names): raise SystemExit('unexpected wrapper directory')
          if any(n.startswith('.github/') or n.startswith('.git/') for n in names): raise SystemExit('git metadata leaked into release')
          PY
          sha256sum "$ZIP" | tee "$RUNNER_TEMP/EnergieProject_v32.3.13.sha256"
          mkdir -p artifact
          cp "$ZIP" artifact/
          cp "$RUNNER_TEMP/EnergieProject_v32.3.13.sha256" artifact/
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergieProject_v32.3.13
          path: artifact/
          if-no-files-found: error
          retention-days: 7
