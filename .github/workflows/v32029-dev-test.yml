name: v32.0.29 dev test

on:
  push:
    branches:
      - feature/v32.0.29-crash-recovery-export

permissions:
  contents: write

jobs:
  crash-recovery-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply guarded integration patch
        run: python tools/apply_v32029_crash_recovery_export.py
      - name: Apply guarded GUI patch
        run: python tools/apply_v32029_crash_recovery_gui.py
      - name: Run crash recovery export and identity tests
        run: pytest -q tests/test_crash_recovery_export.py tests/test_complete_crash_recovery_runtime.py tests/test_crash_recovery_download.py tests/test_crash_recovery_gui.py tests/test_v32029_release_identity.py
      - name: Compile changed Python
        run: python -m py_compile slimmemeterportal_import/rootfs/app/main.py slimmemeterportal_import/rootfs/app/crash_recovery_export.py
      - name: Commit verified integration patch to feature branch
        run: |
          if git diff --quiet -- slimmemeterportal_import/rootfs/app/main.py; then
            echo "No main.py change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slimmemeterportal_import/rootfs/app/main.py
          git commit -m "feat: finalize crash recovery browser UI"
          git push origin HEAD:feature/v32.0.29-crash-recovery-export

# Temporary branch-only workflow; remove before release candidate.
