name: v32.0.29 dev test

on:
  push:
    branches:
      - feature/v32.0.29-crash-recovery-export

permissions:
  contents: read

jobs:
  crash-recovery-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest reportlab
      - name: Verify branch needs no development patches
        run: |
          python tools/apply_v32029_crash_recovery_export.py
          python tools/apply_v32029_crash_recovery_gui.py
          python tools/apply_v32029_release_identity.py
          git diff --exit-code -- slimmemeterportal_import/rootfs/app/main.py slimmemeterportal_import/config.yaml VERSIE.txt tests/test_static.py CHANGELOG.md
      - name: Run full regression suite
        run: pytest -q
      - name: Compile changed Python
        run: python -m py_compile slimmemeterportal_import/rootfs/app/main.py slimmemeterportal_import/rootfs/app/crash_recovery_export.py
      - name: No finalize_month in new export flow
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('slimmemeterportal_import/rootfs/app/main.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in {
                  'run_complete_crash_recovery_export',
                  '_stream_complete_recovery_download',
                  '_cleanup_completed_export',
              }:
                  segment = ast.get_source_segment(p.read_text(encoding='utf-8'), node) or ''
                  assert 'finalize_month' not in segment, node.name
          print('NO_FINALIZE_MONTH_EXPORT_FLOW_OK')
          PY

# Temporary branch-only workflow; remove before release candidate.
