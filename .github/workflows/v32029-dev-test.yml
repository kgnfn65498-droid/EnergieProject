name: v32.0.29 dev test

on:
  push:
    branches:
      - feature/v32.0.29-crash-recovery-export

permissions:
  contents: read

jobs:
  crash-recovery-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run crash recovery export contract tests
        run: pytest -q tests/test_crash_recovery_export.py
