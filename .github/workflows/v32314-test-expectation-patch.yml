name: v32.3.14 stale test expectation patch

on:
  push:
    branches:
      - feature/v32.3.14-release-validation-hold

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[test-expectations-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v32.3.14-release-validation-hold
          fetch-depth: 0
      - name: Update only stale current-release assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('tests/test_static.py'),
              Path('tests/test_v32035_release_identity.py'),
              Path('tests/test_v32037_safe_github_publication.py'),
              Path('tests/test_v32038_automatic_publication_chain.py'),
              Path('tests/test_v3210_historical_energy_excel.py'),
              Path('tests/test_v3211_startup_excel_bootstrap.py'),
              Path('tests/test_v3212_startup_excel_live_nas.py'),
              Path('tests/test_v3220_knowledge_base_structure.py'),
              Path('tests/test_v32312_release_identity.py'),
              Path('tests/test_v3232_assistant_runtime_self_probe.py'),
              Path('tests/test_v3233_assistant_mount_timing_hotfix.py'),
              Path('tests/test_v3234_assistant_acceptance_handoff.py'),
          ]

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              out = []
              count = 0
              for line in text.splitlines(keepends=True):
                  if 'assert' in line and '32.3.13' in line:
                      line = line.replace('32.3.13', '32.3.14')
                      count += 1
                  out.append(line)
              if count:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append((str(path), count))

          identity = Path('tests/test_v32314_release_identity.py')
          text = identity.read_text(encoding='utf-8')
          old = '''    for required in (\n        "RELEASE VALIDATION HOLD",\n        "DEVELOPMENT",\n        "runtime",\n        "automatische maandafsluiting",\n        "noodvrijgave",\n    ):\n        assert required in changelog.split("## 32.3.13", 1)[0]\n'''
          new = '''    section = changelog.split("## 32.3.13", 1)[0].lower()\n    for required in (\n        "release validation hold",\n        "development",\n        "runtime",\n        "automatische maandafsluiting",\n        "noodvrijgave",\n    ):\n        assert required in section\n'''
          if old not in text:
              raise SystemExit('expected v32314 changelog assertion block not found')
          identity.write_text(text.replace(old, new, 1), encoding='utf-8')

          print('ASSERTION_UPDATES')
          for item in changed:
              print(item[0], item[1])
          if not changed:
              raise SystemExit('no stale assertions updated')
          PY
      - name: Commit scoped test updates
        shell: bash
        run: |
          git config user.name "energie-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests
          git diff --cached --quiet && exit 0
          git commit -m "test: align stale current-release expectations with v32.3.14 [test-expectations-applied]"
          git push origin HEAD:feature/v32.3.14-release-validation-hold
