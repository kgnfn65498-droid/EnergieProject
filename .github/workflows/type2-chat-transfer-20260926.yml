name: Type2 Chat Transfer
on:
  push:
    branches:
      - chat-transfer-type2-20260926-1637

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify recovery ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          echo '' | base64 -d > public.pem
          download() {
            local name="$1" url="$2" sha="$3"
            curl --fail --silent --show-error --location -H 'ngrok-skip-browser-warning: 1' "$url" -o "recovery/$name"
            echo "$sha  recovery/$name" | sha256sum -c -
            unzip -t "recovery/$name" >/dev/null
          }
          download ClearUp_002_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_002&expires=1790433336&sha256=0b2f8d32a01b6ac2def714ee4307913f336555a6a13f884f919cf439e6fa71d4&signature=53849657c9d9eccf010f644d3c6fc301cdec82b79ebc6af8a2b8f910406e93ad' 0b2f8d32a01b6ac2def714ee4307913f336555a6a13f884f919cf439e6fa71d4
          download ClearUp_003_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_003&expires=1790433336&sha256=97e445adbe6d869ad0ad337676c79be795b94d2de3a7f4a9bf83794dfab1ca04&signature=55773f81eb87ca86d043eacebdee55debe316b4f739340371aacfc8c8e282463' 97e445adbe6d869ad0ad337676c79be795b94d2de3a7f4a9bf83794dfab1ca04
          download ClearUp_004_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_004&expires=1790433336&sha256=5ed60b17828c295af4370589ff80d5665ce7c1dcb9347cfca82afcb8dcc845e8&signature=22c61e4815ad883724b7a595c656764a23867e1766efd0df6b13ec098feac843' 5ed60b17828c295af4370589ff80d5665ce7c1dcb9347cfca82afcb8dcc845e8
          download ClearUp_005_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_005&expires=1790433337&sha256=4dbc658e333776f6bdd48974e5baa892bef3b9e24e6826f90d4fdc1b8b7fe85f&signature=a805f1876ed9d0680e4a2702452b3354a060b5e0b97e7c90c490cf8d214ce024' 4dbc658e333776f6bdd48974e5baa892bef3b9e24e6826f90d4fdc1b8b7fe85f
          download ClearUp_006_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_006&expires=1790433337&sha256=972f9e7cd6af8a569c550c9280f9c2a3b354ced54ee9bf1e6157242dfc3e7739&signature=2a01d4629b8f125a06c6525355b2b41b5ce36a70924ce45bf85584b14dfb9249' 972f9e7cd6af8a569c550c9280f9c2a3b354ced54ee9bf1e6157242dfc3e7739
          download ClearUp_007_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_007&expires=1790433337&sha256=cf8224545ae1c705c20f8d1ae04aa3ab0039841484973c10266689525c55187f&signature=0e8e110534e537451fcfab99008d6e452a02b7c03809a96cb577583b923e5be0' cf8224545ae1c705c20f8d1ae04aa3ab0039841484973c10266689525c55187f
          download ClearUp_008_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_008&expires=1790433337&sha256=d0bad6326d5d9e5c118b83ec5a1f1a1ad527bcc9c5e8e760731be82c49e2981f&signature=a22497e9b4196a1e35b35ef88988400e151b1f03b12de6fb9bd8c0a38947e932' d0bad6326d5d9e5c118b83ec5a1f1a1ad527bcc9c5e8e760731be82c49e2981f
          download ClearUp_009_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_009&expires=1790433337&sha256=0dc7c356aa81220579107f090468e37eff17264349ce65f4ac1b7c92cd4881b6&signature=d1e6930e565243dfa8e5f2a6078fbd2c33a3dc5b835d6f6f93ce70ce600fb86c' 0dc7c356aa81220579107f090468e37eff17264349ce65f4ac1b7c92cd4881b6
          download ClearUp_010_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_010&expires=1790433337&sha256=26cfb3ba12b6dba3be358eeb60e03429a7f6595655faba2734d01b61969d197f&signature=a39494eca9b8b33dada3256910f2b3abc64078d8bd5e052e2147830347044806' 26cfb3ba12b6dba3be358eeb60e03429a7f6595655faba2734d01b61969d197f
          download ClearUp_011_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_011&expires=1790433337&sha256=fb32304d5f8cb7fd52e80c8db32863f9286df6e94fea2fd2a3e82e688af2943b&signature=0f7a6b6d8f8f7eae6ddea79528e5562b1dbbf2e803fbf5556014546fdf11ab13' fb32304d5f8cb7fd52e80c8db32863f9286df6e94fea2fd2a3e82e688af2943b
          download ClearUp_012_Type2_recovery.zip 'https://quiet-delegator-underpaid.ngrok-free.dev/clearup/type2/download?clearup_id=ClearUp_012&expires=1790433337&sha256=89fd691df0cecb9ba1ead570aa2b42163148f21979a9ab3ddb260ae40103f91a&signature=9e20304670508363ac76e36add5901a1cbb84587a13b7e2458063800b2f19d0c' 89fd691df0cecb9ba1ead570aa2b42163148f21979a9ab3ddb260ae40103f91a
          (cd recovery && sha256sum *.zip | sort > SHA256SUMS.txt)
          zip -r -9 Type2_recovery_bundle.zip recovery >/dev/null
          openssl rand -hex 32 > aes.pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in Type2_recovery_bundle.zip -out Type2_recovery_bundle.enc -pass file:aes.pass
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in aes.pass -out aes.pass.enc
          rm -rf recovery Type2_recovery_bundle.zip aes.pass public.pem

      - name: Upload encrypted transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: type2-chat-transfer-20260926
          path: |
            Type2_recovery_bundle.enc
            aes.pass.enc
          if-no-files-found: error
          retention-days: 1
