name: v32.3.12 verification

on:
  push:
    branches:
      - feature/v32.3.12-operating-modes

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v32.3.12-operating-modes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'reportlab>=4,<5' 'pypdf>=5,<7' 'xlsxwriter>=3.2,<4' 'websocket-client>=1.8,<2'

      - name: Run full regression suite
        run: pytest -q
