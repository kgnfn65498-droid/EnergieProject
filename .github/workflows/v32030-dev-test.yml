name: v32.0.30 source gate

on:
  push:
    branches:
      - feature/v32.0.30-crash-recovery-heartbeat

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest reportlab pypdf
      - name: Full source regression and safety gate
        run: |
          set -eu
          test "$(tr -d '\r\n ' < VERSIE.txt)" = "32.0.30"
          pytest -q
          python -m py_compile slimmemeterportal_import/rootfs/app/main.py slimmemeterportal_import/rootfs/app/crash_recovery_export.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('slimmemeterportal_import/rootfs/app/main.py')
          source = p.read_text(encoding='utf-8')
          tree = ast.parse(source)
          expected = {
              'run_complete_crash_recovery_export',
              '_stream_complete_recovery_download',
              '_cleanup_completed_export',
          }
          checked = set()
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in expected:
                  checked.add(node.name)
                  segment = ast.get_source_segment(source, node) or ''
                  assert 'finalize_month' not in segment, node.name
          assert checked == expected, checked
          assert 'APP_VERSION = "32.0.30"' in source
          assert 'PRODUCTION_CORE_REVISION = "9.4-core1"' in source
          print('NO_FINALIZE_MONTH_EXPORT_FLOW_OK')
          PY
      - name: Docker startup gate from exact source
        run: |
          set -eu
          docker build \
            --build-arg BUILD_FROM=python:3.12-alpine \
            --build-arg BUILD_VERSION=32.0.30 \
            --build-arg BUILD_ARCH=amd64 \
            -t energie-v32030-source \
            slimmemeterportal_import
          ROOT="$RUNNER_TEMP/source-smoke"
          mkdir -p "$ROOT/data" "$ROOT/config" "$ROOT/share/EnergieProject/App" "$ROOT/share/EnergieProject/Data" "$ROOT/share/EnergieProject/Backups" "$ROOT/share/EnergieProject/Inbox" "$ROOT/share/EnergieProject/Infra"
          printf '{}\n' > "$ROOT/data/options.json"
          docker run -d --name energie-v32030-source \
            -p 18099:8099 \
            -v "$ROOT/data:/data" \
            -v "$ROOT/config:/config" \
            -v "$ROOT/share:/share/Energie_NAS" \
            energie-v32030-source \
            python3 -u /app/main.py
          trap 'docker rm -f energie-v32030-source >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/health >/tmp/source-health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18099/health | tee /tmp/source-health.json
          curl -fsS http://127.0.0.1:18099/ | grep -q 'SlimmeMeterPortal'
          curl -fsS http://127.0.0.1:18099/api/hassio_ingress/test | grep -q 'SlimmeMeterPortal'
          curl -fsS http://127.0.0.1:18099/api/crash-recovery/state >/tmp/source-recovery-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          h = json.loads(Path('/tmp/source-health.json').read_text())
          assert h.get('status') in {'ok', 'healthy'}, h
          assert h.get('version') == '32.0.30', h
          assert isinstance(json.loads(Path('/tmp/source-recovery-state.json').read_text()), dict)
          print('SOURCE_HEALTH_HTTP_200_OK')
          print('SOURCE_GUI_HTTP_200_OK')
          print('SOURCE_INGRESS_HTTP_200_OK')
          print('SOURCE_RECOVERY_STATE_HTTP_200_OK')
          PY
          if docker logs energie-v32030-source 2>&1 | grep -q 'Traceback (most recent call last)'; then
            docker logs energie-v32030-source
            exit 1
          fi
          echo SOURCE_STARTUP_ZONDER_TRACEBACK_OK
