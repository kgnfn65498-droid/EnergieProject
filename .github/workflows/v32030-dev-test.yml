name: v32.0.30 dev test

on:
  push:
    branches:
      - feature/v32.0.30-crash-recovery-heartbeat

permissions:
  contents: write

jobs:
  crash-recovery-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest reportlab pypdf
      - name: Run crash recovery tests
        run: pytest -q tests/test_crash_recovery_export.py tests/test_crash_recovery_download.py

  apply-main-filename-patch:
    if: ${{ github.event.head_commit.message == 'ci: apply main filename patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main.py exactly once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('slimmemeterportal_import/rootfs/app/main.py')
          source = p.read_text(encoding='utf-8')
          marker = 'def run_complete_crash_recovery_export(\n'
          helper = (
              'def _crash_recovery_export_filename(now: datetime) -> str:\n'
              '    """Bestandsnaam voor browser/iCloud Crash Recovery zonder onveilige dubbele punt."""\n'
              '    return now.strftime("%Y-%m-%d %H.%M CrashRecovery EnergieProject.zip")\n\n\n'
          )
          assert '_crash_recovery_export_filename' not in source
          assert source.count(marker) == 1
          source = source.replace(marker, helper + marker, 1)
          old = (
              '            stamp = datetime.now(TZ).strftime("%Y%m%dT%H%M%S")\n'
              '            export_name = f"EnergieProject_Complete_Crash_Recovery_{stamp}.zip"\n'
          )
          new = '            export_name = _crash_recovery_export_filename(datetime.now(TZ))\n'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          p.write_text(source, encoding='utf-8')
          PY
          git diff --check
      - name: Commit patched source
        run: |
          git config user.name 'EnergieProject CI'
          git config user.email 'energieproject@local'
          git add slimmemeterportal_import/rootfs/app/main.py
          git commit -m 'feat: use readable crash recovery download name'
          git push origin HEAD:feature/v32.0.30-crash-recovery-heartbeat
