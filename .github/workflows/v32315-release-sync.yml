name: v32.3.15 release sync verify

on:
  push:
    branches:
      - feature/v32.3.15-gui-navigation
    paths:
      - .github/workflows/v32315-release-sync.yml

permissions:
  contents: write

jobs:
  sync-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v32.3.15-gui-navigation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -q pytest pypdf reportlab xlsxwriter

      - name: Apply deterministic v32.3.15 identity/test alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          for rel in [
              'VERSIE.txt',
              'slimmemeterportal_import/config.yaml',
              'slimmemeterportal_import/rootfs/app/main.py',
              'slimmemeterportal_import/rootfs/app/mode_entrypoint.py',
          ]:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if '32.3.15' not in s:
                  s = s.replace('32.3.14', '32.3.15', 1)
              p.write_text(s, encoding='utf-8')

          root = Path('CHANGELOG.md')
          s = root.read_text(encoding='utf-8')
          entry = '''## 32.3.15 — Ingress GUI navigation\n- Operating-mode GUI actions use Post/Redirect/Get and return to the Energieproject page with a concise result banner.\n- Non-GUI structured JSON behavior remains unchanged.\n- Bedrijfsmodus distinguishes basis-profile from measured effective month-processing state.\n- No controller, HOLD, scheduler, watcher or month-close semantics changed.\n\n'''
          if not s.startswith('## 32.3.15 — Ingress GUI navigation'):
              root.write_text(entry + s, encoding='utf-8')

          Path('slimmemeterportal_import/CHANGELOG.md').write_text('''# Changelog\n\n## 32.3.15\n\n- Operating-mode GUI actions use Post/Redirect/Get and return to the Energieproject page with a concise result banner.\n- Non-GUI structured JSON behavior remains unchanged.\n- Bedrijfsmodus distinguishes basis-profile from measured effective month-processing state.\n- No controller, HOLD, scheduler, watcher or month-close semantics changed.\n''', encoding='utf-8')

          current_identity_files = [
              'tests/test_static.py',
              'tests/test_v32035_release_identity.py',
              'tests/test_v32037_safe_github_publication.py',
              'tests/test_v32038_automatic_publication_chain.py',
              'tests/test_v3210_historical_energy_excel.py',
              'tests/test_v3211_startup_excel_bootstrap.py',
              'tests/test_v3212_startup_excel_live_nas.py',
              'tests/test_v3220_knowledge_base_structure.py',
              'tests/test_v32312_release_identity.py',
              'tests/test_v3232_assistant_runtime_self_probe.py',
              'tests/test_v3233_assistant_mount_timing_hotfix.py',
              'tests/test_v3234_assistant_acceptance_handoff.py',
          ]
          for rel in current_identity_files:
              p = Path(rel)
              s = p.read_text(encoding='utf-8').replace('32.3.14', '32.3.15')
              s = s.replace('## 32.3.15 — Release Validation Hold', '## 32.3.15 — Ingress GUI navigation')
              s = s.replace(r'32\.3\.14', r'32\.3\.15')
              p.write_text(s, encoding='utf-8')

          p = Path('tests/test_v32314_release_identity.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_v32314_release_identity_is_consistent():\n    assert (ROOT / "VERSIE.txt").read_text(encoding="utf-8").strip() == "32.3.14"\n\n    config = (ROOT / "slimmemeterportal_import/config.yaml").read_text(encoding="utf-8")\n    assert re.search(r'^version:\\s*"32\\.3\\.14"\\s*$', config, re.MULTILINE)\n\n    entry = (APP_ROOT / "mode_entrypoint.py").read_text(encoding="utf-8")\n    assert 'TARGET_RELEASE_VERSION = "32.3.14"' in entry\n\n    main = (APP_ROOT / "main.py").read_text(encoding="utf-8")\n    assert 'APP_VERSION = "32.3.14"' in main\n'''
          new = '''def test_v32314_release_identity_is_preserved_in_history():\n    changelog = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")\n    assert "## 32.3.14 — Release Validation Hold" in changelog\n'''
          s = s.replace(old, new)
          s = s.replace(
              '''    assert changelog.startswith("## 32.3.14 — Release Validation Hold")\n    section = changelog.split("## 32.3.13", 1)[0].lower()\n''',
              '''    assert "## 32.3.14 — Release Validation Hold" in changelog\n    section = changelog.split("## 32.3.14 — Release Validation Hold", 1)[1].split("## 32.3.13", 1)[0].lower()\n''',
          )
          p.write_text(s, encoding='utf-8')

          Path('tests/test_v32315_release_identity.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_current_release_identity_is_v32315():\n    assert (ROOT / "VERSIE.txt").read_text(encoding="utf-8").strip() == "32.3.15"\n    assert 'version: "32.3.15"' in (ROOT / "slimmemeterportal_import/config.yaml").read_text(encoding="utf-8")\n    assert 'TARGET_RELEASE_VERSION = "32.3.15"' in (ROOT / "slimmemeterportal_import/rootfs/app/mode_entrypoint.py").read_text(encoding="utf-8")\n    assert 'APP_VERSION = "32.3.15"' in (ROOT / "slimmemeterportal_import/rootfs/app/main.py").read_text(encoding="utf-8")\n\n\ndef test_v32315_changelog_is_gui_only_safety_preserving_release():\n    root_change = (ROOT / "CHANGELOG.md").read_text(encoding="utf-8")\n    addon_change = (ROOT / "slimmemeterportal_import/CHANGELOG.md").read_text(encoding="utf-8")\n    assert root_change.startswith("## 32.3.15 — Ingress GUI navigation")\n    assert "Post/Redirect/Get" in root_change\n    assert "structured JSON" in root_change\n    assert "basis-profile" in root_change\n    assert "No controller, HOLD, scheduler, watcher or month-close semantics changed." in root_change\n    assert "## 32.3.15" in addon_change.splitlines()[:5]\n''', encoding='utf-8')
          PY

      - name: Full regression suite
        run: python -m pytest -q

      - name: Commit verified release alignment
        run: |
          git config user.name 'kgnfn65498-droid'
          git config user.email 'kgnfn65498@privaterelay.appleid.com'
          git add VERSIE.txt CHANGELOG.md slimmemeterportal_import/config.yaml slimmemeterportal_import/CHANGELOG.md slimmemeterportal_import/rootfs/app/main.py slimmemeterportal_import/rootfs/app/mode_entrypoint.py tests
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare v32.3.15 GUI navigation'
          git push origin HEAD:feature/v32.3.15-gui-navigation
