name: v32.3.13 apply hotfix

on:
  push:
    branches:
      - hotfix/v32.3.13-mode-state-permissions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v32.3.13-mode-state-permissions
      - name: Align root changelog release heading
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          old = '## 32.3.12 — Operating modes enforced'
          new = '## 32.3.13 — Operating modes enforced'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          elif not text.startswith(new):
              raise SystemExit('unexpected root changelog heading')
          PY
          if git diff --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: align v32.3.13 root changelog heading'
          git push
