name: final verify and build v32.3.14

on:
  push:
    branches:
      - feature/v32.3.14-release-validation-hold
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a717ca20e79e5b8b793848746d9d0484efcff126
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact clean source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a717ca20e79e5b8b793848746d9d0484efcff126"
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest openpyxl xlsxwriter pypdf reportlab
          pytest -q
      - name: Build and deep-validate installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSIE.txt)"
          test "$VERSION" = "32.3.14"
          STAGE="$RUNNER_TEMP/release-stage"
          ZIP="$RUNNER_TEMP/EnergieProject_v32.3.14.zip"
          rm -rf "$STAGE" "$ZIP"
          mkdir -p "$STAGE"
          git ls-files -z | while IFS= read -r -d '' path; do
            case "$path" in
              .github/*|MANIFEST.sha256|SHA256SUMS.json) continue ;;
            esac
            mkdir -p "$STAGE/$(dirname "$path")"
            cp -p "$path" "$STAGE/$path"
          done
          python - "$STAGE" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          stage = Path(sys.argv[1])
          files = sorted(p for p in stage.rglob('*') if p.is_file())
          rows=[]
          manifest=[]
          for p in files:
              rel=p.relative_to(stage).as_posix()
              data=p.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              manifest.append(f"{sha}  {rel}\n")
              rows.append({'path':rel,'sha256':sha,'size':len(data)})
          (stage/'MANIFEST.sha256').write_text(''.join(manifest), encoding='utf-8')
          (stage/'SHA256SUMS.json').write_text(json.dumps({'version':'32.3.14','source_commit':'a717ca20e79e5b8b793848746d9d0484efcff126','files':rows}, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(f'MANIFEST_ENTRIES={len(rows)}')
          PY
          REQUIRED="README.md INSTALL.md CHANGELOG.md MANIFEST.sha256 SHA256SUMS.json repository.yaml VERSIE.txt"
          for f in $REQUIRED; do test -f "$STAGE/$f"; done
          (cd "$STAGE" && sha256sum -c MANIFEST.sha256 >/dev/null)
          test "$(tr -d '\r\n ' < "$STAGE/VERSIE.txt")" = "32.3.14"
          grep -q 'version: "32.3.14"' "$STAGE/slimmemeterportal_import/config.yaml"
          grep -q 'APP_VERSION = "32.3.14"' "$STAGE/slimmemeterportal_import/rootfs/app/main.py"
          grep -q 'TARGET_RELEASE_VERSION = "32.3.14"' "$STAGE/slimmemeterportal_import/rootfs/app/mode_entrypoint.py"
          test -f "$STAGE/slimmemeterportal_import/rootfs/app/release_validation_hold.py"
          grep -q 'blocked_release_validation_hold' "$STAGE/slimmemeterportal_import/rootfs/app/operating_mode_runtime.py"
          grep -q 'def reconcile_measured_runtime' "$STAGE/slimmemeterportal_import/rootfs/app/operating_mode_runtime.py"
          grep -q 'def validate_release_hold' "$STAGE/slimmemeterportal_import/rootfs/app/operating_mode_runtime.py"
          grep -q 'def attempt_emergency_release_hold' "$STAGE/slimmemeterportal_import/rootfs/app/operating_mode_runtime.py"
          grep -q 'capture_previous_release_validation_hold(){' "$STAGE/tools/release_installer.sh"
          grep -q 'restore_previous_release_validation_hold(){' "$STAGE/tools/release_installer.sh"
          grep -q 'RELEASE_HOLD_STATE="$INBOX/operating_mode/release_validation_hold.json"' "$STAGE/tools/release_installer.sh"
          (cd "$STAGE" && zip -qr "$ZIP" .)
          unzip -t "$ZIP" >/dev/null
          python - "$ZIP" <<'PY'
          import hashlib, json, zipfile, sys
          z=zipfile.ZipFile(sys.argv[1])
          names=set(z.namelist())
          required={'README.md','INSTALL.md','CHANGELOG.md','MANIFEST.sha256','SHA256SUMS.json','repository.yaml','VERSIE.txt','slimmemeterportal_import/rootfs/app/release_validation_hold.py'}
          missing=required-names
          if missing: raise SystemExit(f'missing release files: {sorted(missing)}')
          if any(n.startswith('EnergieProject/') for n in names): raise SystemExit('unexpected wrapper directory')
          if any(n.startswith('.github/') or n.startswith('.git/') for n in names): raise SystemExit('git metadata leaked into release')
          if z.read('VERSIE.txt').decode().strip() != '32.3.14': raise SystemExit('wrong VERSIE in zip')
          sums=json.loads(z.read('SHA256SUMS.json'))
          if sums.get('version') != '32.3.14': raise SystemExit('wrong SHA256SUMS version')
          if sums.get('source_commit') != 'a717ca20e79e5b8b793848746d9d0484efcff126': raise SystemExit('wrong source commit')
          manifest_lines=z.read('MANIFEST.sha256').decode().splitlines()
          for line in manifest_lines:
              expected, rel=line.split('  ',1)
              actual=hashlib.sha256(z.read(rel)).hexdigest()
              if actual != expected: raise SystemExit(f'manifest mismatch: {rel}')
          entry=z.read('slimmemeterportal_import/rootfs/app/mode_entrypoint.py').decode()
          if entry.index('install_release_hold_guards(app, root)') > entry.index('app.main()'): raise SystemExit('hold guards installed too late')
          runtime=z.read('slimmemeterportal_import/rootfs/app/operating_mode_runtime.py').decode()
          for token in ('blocked_release_validation_hold','reconcile_measured_runtime','validate_release_hold','attempt_emergency_release_hold'):
              if token not in runtime: raise SystemExit(f'missing runtime safety token: {token}')
          installer=z.read('tools/release_installer.sh').decode()
          hold_call='write_release_validation_hold || fail "release validation hold activeren mislukt"'
          git_push='git push origin main'
          ha_publish='write_ha_publication_required "$PROCESSED_SHA256"'
          if installer.count(hold_call) != 1: raise SystemExit('hold call count invalid')
          if installer.index(hold_call) > installer.index(git_push): raise SystemExit('hold armed after git publication')
          if installer.index(hold_call) > installer.index(ha_publish): raise SystemExit('hold armed after HA publication')
          if 'restore_previous_release_validation_hold || log "FOUT: vorige release-hold kon niet worden hersteld"' not in installer: raise SystemExit('hold rollback restore missing')
          print(f'ZIP_ENTRIES={len(names)}')
          print(f'MANIFEST_VERIFIED={len(manifest_lines)}')
          PY
          sha256sum "$ZIP" | tee "$RUNNER_TEMP/EnergieProject_v32.3.14.sha256"
          mkdir -p artifact
          cp "$ZIP" artifact/
          cp "$RUNNER_TEMP/EnergieProject_v32.3.14.sha256" artifact/
      - name: Upload final installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnergieProject_v32.3.14-final
          path: artifact/
          if-no-files-found: error
          retention-days: 7
