name: v32.3.13 hotfix verification

on:
  push:
    branches:
      - hotfix/v32.3.13-mode-state-permissions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'reportlab>=4,<5' 'pypdf>=5,<7' 'xlsxwriter>=3.2,<4' 'websocket-client>=1.8,<2'
      - name: Run full regression suite on final hotfix head
        run: pytest -q
