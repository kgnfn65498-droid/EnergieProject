name: v32.3.14 identity patch

on:
  push:
    branches:
      - feature/v32.3.14-release-validation-hold

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[identity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v32.3.14-release-validation-hold
          fetch-depth: 0
      - name: Apply exact release identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "32.3.14"
          Path("VERSIE.txt").write_text(version + "\n", encoding="utf-8")

          config = Path("slimmemeterportal_import/config.yaml")
          text = config.read_text(encoding="utf-8")
          old = 'version: "32.3.13"'
          if old not in text:
              raise SystemExit("expected config version 32.3.13 not found")
          config.write_text(text.replace(old, f'version: "{version}"', 1), encoding="utf-8")

          entry = Path("slimmemeterportal_import/rootfs/app/mode_entrypoint.py")
          text = entry.read_text(encoding="utf-8")
          old = 'TARGET_RELEASE_VERSION = "32.3.13"'
          if old not in text:
              raise SystemExit("expected entrypoint version 32.3.13 not found")
          entry.write_text(text.replace(old, f'TARGET_RELEASE_VERSION = "{version}"', 1), encoding="utf-8")

          main = Path("slimmemeterportal_import/rootfs/app/main.py")
          text = main.read_text(encoding="utf-8")
          old = 'APP_VERSION = "32.3.13"'
          if old not in text:
              raise SystemExit("expected main version 32.3.13 not found")
          main.write_text(text.replace(old, f'APP_VERSION = "{version}"', 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## 32.3.14 — Release Validation Hold"
          if not text.startswith(heading):
              block = '''## 32.3.14 — Release Validation Hold
          - Voegt een persistente `RELEASE VALIDATION HOLD` toe bovenop USER / DEVELOPMENT / MAINTENANCE; automatische muterende energieworkflows blijven geblokkeerd totdat de nieuwe release echt is gevalideerd.
          - Een actieve DEVELOPMENT-sessie blijft persistent over release en reboot en eindigt uitsluitend na expliciete bevestiging van de gebruiker; een geslaagde release schakelt dus niet zelfstandig terug naar USER.
          - Reconciliation meet voortaan de werkelijke runtime-status. Een lopende workflow tijdens HOLD wordt DRIFT en gebruikt het bestaande gecontroleerde cancellation-pad in plaats van vals `Reconcile OK` te melden.
          - Automatische maandafsluiting is tijdens HOLD dubbel geblokkeerd: via de effectieve scheduleropties én opnieuw direct bij de automatische execute-entrypoint; de lopende kalendermaand blijft afzonderlijk beschermd.
          - HOLD-vrijgave gebruikt vijf compacte kernchecks plus echte runtime-reconcile. Een noodvrijgave blijft beschikbaar na expliciete bevestiging en veilige read-only controle en wordt geaudit.
          - De release-installer activeert de HOLD fail-closed in de schrijfbare `Inbox/operating_mode` vóór Home Assistant de nieuwe release kan publiceren.

          '''
              changelog.write_text(block + text, encoding="utf-8")
          PY
      - name: Commit identity patch
        shell: bash
        run: |
          git config user.name "energie-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add VERSIE.txt CHANGELOG.md slimmemeterportal_import/config.yaml slimmemeterportal_import/rootfs/app/mode_entrypoint.py slimmemeterportal_import/rootfs/app/main.py
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v32.3.14 safety identity [identity-applied]"
          git push origin HEAD:feature/v32.3.14-release-validation-hold
