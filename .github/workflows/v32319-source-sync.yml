name: v32.3.19 source sync

on:
  push:
    branches:
      - hotfix/v32.3.19-crash-recovery-hardening-auto-hold

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified v32.3.19 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = Path('.github/v32319.patch.b64').read_text(encoding='utf-8').strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          actual = hashlib.sha256(raw).hexdigest()
          expected = '4ed319b2b7aeedfd8ac589ae0ce9c95b9c721cb2d8a66e53ad54106c67b26e4b'
          if actual != expected:
              raise SystemExit(f'PATCH_SHA_MISMATCH {actual}')
          Path('/tmp/v32319.patch').write_bytes(raw)
          print('PATCH_SHA_OK', actual)
          PY
          git apply --check /tmp/v32319.patch
          git apply /tmp/v32319.patch
          rm -f .github/v32319.patch.b64 .github/workflows/v32319-source-sync.yml
          git config user.name "EnergieProject Sync"
          git config user.email "energieproject@local"
          git add -A
          git commit -m "v32.3.19: crash recovery hardening and automatic hold release [skip ci]"
          git push origin HEAD:hotfix/v32.3.19-crash-recovery-hardening-auto-hold
