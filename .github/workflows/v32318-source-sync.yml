name: v32.3.18 source sync

on:
  push:
    branches:
      - hotfix/v32.3.18-live-mode-gui-refresh

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct and apply verified local patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v32318_patch_gz/full.b64 | base64 -d | gzip -d > /tmp/v32318.patch
          git apply --check /tmp/v32318.patch
          git apply /tmp/v32318.patch
          rm -rf .github/v32318_patch_gz
          rm -f .github/workflows/v32318-source-sync.yml
          git config user.name "EnergieProject Sync"
          git config user.email "energieproject@local"
          git add -A
          git commit -m "v32.3.18: live mode GUI refresh [skip ci]"
          git push origin HEAD:hotfix/v32.3.18-live-mode-gui-refresh
