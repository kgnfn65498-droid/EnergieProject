name: v32.3.17 source sync v2

on:
  push:
    branches:
      - hotfix/v32.3.17-publication-v2
    paths:
      - .github/workflows/v32317-source-sync-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply verified local patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v32317_patch_gz/part* | base64 -d | gzip -d > /tmp/v32317.patch
          echo '377dd05f0c5d37a884b8b1f47c64cd592dec38ef971ada3d22cb8f522f369eec  /tmp/v32317.patch' | sha256sum -c -
          git apply --check /tmp/v32317.patch
          git apply /tmp/v32317.patch
          rm -rf .github/v32317_patch_gz
          rm -f .github/workflows/v32317-source-sync-v2.yml
          git config user.name "EnergieProject Sync"
          git config user.email "energieproject@local"
          git add -A
          git commit -m "v32.3.17: idempotent GitHub publication [skip ci]"
          git push origin HEAD:hotfix/v32.3.17-publication-v2
