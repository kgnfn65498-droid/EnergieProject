name: v32.3.16 source sync verify

on:
  push:
    branches:
      - feature/v32.3.16-crash-recovery-maintenance
    paths:
      - .github/workflows/v32316-source-sync.yml

permissions:
  contents: write

jobs:
  sync-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v32.3.16-crash-recovery-maintenance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact locally verified source patch
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/v32316.patch
          git apply --index /tmp/v32316.patch
          git diff --cached --check

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf reportlab xlsxwriter

      - name: Run complete v32.3.16 suite
        env:
          TERM: xterm
        run: pytest -q

      - name: Commit verified source
        run: |
          git config user.name "EnergieProject CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "release: implement v32.3.16 Crash Recovery maintenance"
          git push origin HEAD:feature/v32.3.16-crash-recovery-maintenance
