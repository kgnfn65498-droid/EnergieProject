name: "SlimmeMeterPortal Import"
version: "4.2.1"
slug: "slimmemeterportal_import"
description: "Onafhankelijke maandcontrole via de officiële SlimmeMeterPortal UserAPI."
url: "https://github.com/kgnfn65498-droid/EnergieProject"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:meter-electric-outline"
panel_title: "SlimmeMeterPortal"
watchdog: "http://[HOST]:[PORT:8099]/health"
map:
  - type: addon_config
    read_only: false
options:
  api_key: ""
  run_on_start: false
  target_month: ""
  schedule_enabled: true
  schedule_day: 2
  schedule_hour: 3
  request_timeout_seconds: 30
  retry_count: 3
  usage_path_template: "/userapi/v1/connections/{connection_id}/usage/{date}"
  resume_incomplete_month: true
  retention_months: 24
  verify_after_import: true
  fail_on_validation_errors: false
  detect_duplicates: true
  create_month_summary: true
  create_transfer_bundle: true
  workflow_mode: "smp_only"
  homewizard_enabled: false
  homewizard_discovery_enabled: true
  homewizard_discovery_cidr: ""
  homewizard_discovery_timeout_seconds: 1
  homewizard_devices: []
  homewizard_sample_seconds: 900
  enphase_enabled: false
  enphase_source_url: ""
  enphase_bearer_token: ""
  epex_electricity_enabled: false
  epex_electricity_url: ""
  epex_gas_enabled: false
  epex_gas_url: ""
  report_trigger_enabled: false
  report_trigger_url: ""
  report_trigger_token: ""
  require_all_core_sources: true
schema:
  api_key: password
  run_on_start: bool
  target_month: "match(^$|^[0-9]{4}-(0[1-9]|1[0-2])$)"
  schedule_enabled: bool
  schedule_day: "int(1,28)"
  schedule_hour: "int(0,23)"
  request_timeout_seconds: "int(5,120)"
  retry_count: "int(0,10)"
  usage_path_template: str
  resume_incomplete_month: bool
  retention_months: "int(1,120)"
  verify_after_import: bool
  fail_on_validation_errors: bool
  detect_duplicates: bool
  create_month_summary: bool
  create_transfer_bundle: bool
  workflow_mode: "list(smp_only|full_month_workflow)"
  homewizard_enabled: bool
  homewizard_discovery_enabled: bool
  homewizard_discovery_cidr: str
  homewizard_discovery_timeout_seconds: "int(1,5)"
  homewizard_devices:
    - label: str
      host: str
      role: "list(p1|gas|socket|other)"
      optional: bool
      output_name: str
  homewizard_sample_seconds: "int(60,3600)"
  enphase_enabled: bool
  enphase_source_url: str
  enphase_bearer_token: password
  epex_electricity_enabled: bool
  epex_electricity_url: str
  epex_gas_enabled: bool
  epex_gas_url: str
  report_trigger_enabled: bool
  report_trigger_url: str
  report_trigger_token: password
  require_all_core_sources: bool
